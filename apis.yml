name: Cure Genetics
description: >-
  Cure Genetics (克睿基因) is a clinical-stage biotechnology company founded in 2016 and
  based in Suzhou, Jiangsu, China, developing cell and gene therapies for solid tumors
  and genetic diseases. Its differentiated pipeline is built on two proprietary platforms:
  AIMS CAR-NKT, a cell-therapy approach engineered to improve solid-tumor infiltration and
  modulate the tumor microenvironment, and VELP, an AAV (adeno-associated viral) vector
  technology targeting the nervous system, heart, and kidneys. Lead programs include CGC729,
  an anti-CD70 CAR-NKT therapy in Phase I trials for renal cell carcinoma, and CGC-602, a
  PD-1-IL-2v bispecific molecule for cancer immunotherapy. The company is backed by Qiming
  Venture Partners, Advantech Capital, and Oriza Holdings. It publishes no public API,
  developer platform, or technical documentation; this profile is maintained in the API
  Evangelist network as a company record surfaced from the Qiming portfolio.
